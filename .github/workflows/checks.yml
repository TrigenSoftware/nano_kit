name: Checks
on:
  pull_request:
    branches:
      - main
# The token of a run only reads: code that a pull request runs cannot push or start a release with it
permissions:
  contents: read
jobs:
  size:
    runs-on: ubuntu-latest
    name: size-limit
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build packages
        run: pnpm build
      - name: Check size
        run: pnpm test:size
  editorconfig:
    runs-on: ubuntu-latest
    name: editorconfig
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Install editorconfig-checker
        # A third-party action is pinned to a commit, so a new push to its branch does not run here: main on 2026-09-21
        uses: editorconfig-checker/action-editorconfig-checker@7e30171fc973d78099d7dfc78e27c07d3c4a639f
      - name: Check editorconfig
        run: editorconfig-checker
  package-json:
    runs-on: ubuntu-latest
    name: package.json
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: 'pnpm'
      - name: Check package.json files
        run: pnpm --package=@trigen/lint-package-json dlx lint-package-json --monorepo --ignore examples
