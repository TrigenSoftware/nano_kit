name: Tests
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  types:
    runs-on: ubuntu-latest
    name: types
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Check types
        run: pnpm test:types
  lint:
    runs-on: ubuntu-latest
    name: lint
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Lint files
        run: pnpm lint
  unit:
    runs-on: ubuntu-latest
    name: unit (${{ matrix.node-version || '.tool-versions' }})
    strategy:
      matrix:
        # The least Node.js the packages declare, and the one the repository is developed on
        include:
          - node-version: 24
          - node-version-file: .tool-versions
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version-file }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Install Chrome for headless testing
        run: pnpm test:install-deps
      - name: Run tests
        run: pnpm test:unit
      # One upload per commit, from the leg of the version the repository is developed on
      - name: Collect coverage
        uses: codecov/codecov-action@v7
        if: success() && matrix.node-version-file
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  integration:
    runs-on: ubuntu-latest
    name: integration
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      # The examples take the kit from its sources, and the devtools from the build that inlines their styles
      - name: Build the devtools
        run: pnpm --filter @nano_kit/devtools build
      - name: Install Chrome for headless testing
        run: pnpm test:install-deps
      - name: Restore integration test cache
        uses: actions/cache/restore@v6
        with:
          path: examples/**/common/test/integration-test-cache.json
          key: integration-test-cache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            integration-test-cache-${{ runner.os }}-
      - name: Run tests
        run: |
          for attempt in 1 2 3; do
            pnpm examples:test && exit 0
            echo "Integration tests failed on attempt ${attempt}"
          done
          exit 1
      - name: Save integration test cache
        uses: actions/cache/save@v6
        if: success()
        with:
          path: examples/**/common/test/integration-test-cache.json
          key: integration-test-cache-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
